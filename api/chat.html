// === Корабли в виде из кабины (cabin) — РЕАЛЬНЫЕ данные карты системы ===
// Роли: python — корабли других игроков (otherShips — оранжевые точки на карте),
// viper — trader, sidewinder — caravan, mamba — pirate (sysShipsSim — точки НПС
// с путями; тип в поле k, путь на карте — пунктир к цели tx,ty).
// Позиции берём из данных карты и проецируем тем же курсом, что и «Реальные
// объекты системы» в drawCobra: корабль стоит ровно там, где его точка на карте.
// Курс НПС — по их пути (tx,ty), курс игроков — по фактическому смещению между
// опросами (раз в секунду). Между опросами корабли летят по последней скорости
// (dead reckoning), отрисовка сглаживается лерпом — без рывков при обновлении.
// Размер: модель переводится в единицы карты (CABIN_SHIP_K), поэтому дальний
// корабль — маленький каркас или точка, близкий растёт (настоящая перспектива).
const SIM_COLORS = {1: "#4ac", 2: "#dd7", 3: "#c9f", 4: "#9df", 5: "#f66"}; // цвета НПС: карта = кабина
const SIM_KIND_ROLE = { 1: "trader", 2: "trader", 3: "caravan", 4: "caravan", 5: "pirate" };
const CABIN_ROLE_MODEL = { player: SHIP_PYTHON, trader: SHIP_VIPER, caravan: SHIP_SIDEWINDER, pirate: SHIP_MAMBA };
const CABIN_SHIP_K = 0.0012; // единиц карты на единицу модели — видимый размер корабля
const CABIN_CAM_K  = 100000;   // перевод ед. карты → ед. камеры для отрисовки каркасов
let cabinView = null;        // параметры камеры кабины (заполняется в drawCobra)
const cabinLive = new Map(); // key → состояние корабля: данные карты + сглаженная отрисовка

function cabinGet(key, role, color, model) {
  let e = cabinLive.get(key);
  if (!e) {
    let span = 0; // размах модели в её координатах (экранный размер и пропуск вблизи)
    for (const v of model.vertices) span = Math.max(span, Math.abs(v[0]), Math.abs(v[1]), Math.abs(v[2]));
    e = {
      key, role, color, model, span, id: null, label: role,
      yaw: 0, pos: null,          // отрисовка: сглаженные разворот и позиция в камере
      wx: 0, wy: 0, tData: 0,     // последняя позиция с карты + время снимка
      tSeen: 0,                   // когда корабль последний раз был в данных карты
      vx: 0, vy: 0,               // скорость (мёртвое счисление), ед. карты/с
      ndx: 1, ndy: 0,             // курс (единичный вектор в плоскости карты)
      spd: 0, txd: null, sys: false // НПС: скорость по пути и дистанция до цели
    };
    cabinLive.set(key, e);
  }
  return e;
}

// Игроки (otherShips, опрос раз в секунду): скорость и курс — по смещению между
// соседними опросами; стоит на месте — просто обновляем позицию.
function cabinObservePlayers(now) {
  for (const sh of otherShips) {
    if (!sh || !sh.pos) continue;
    if (shipData && sh.shipId === shipData.shipId) continue; // свой корабль не рисуем
    const e = cabinGet("P" + sh.shipId, "player", "#fc6", SHIP_PYTHON);
    e.id = sh.shipId; e.label = "player #" + sh.shipId;
    if (e.tData) {
      const dt = Math.max(0.2, (now - e.tData) / 1000);
      const ddx = sh.pos.X - e.wx, ddy = sh.pos.Y - e.wy;
      const v = Math.hypot(ddx, ddy) / dt;
      if (v >= 0.5) { e.vx = 0; e.vy = 0; } // скачок (перелёт) — не экстраполируем
      else if (v > 1e-5) {
        e.vx = ddx / dt; e.vy = ddy / dt;
        e.ndx = ddx / (v * dt); e.ndy = ddy / (v * dt);
      }
    }
    e.wx = sh.pos.X; e.wy = sh.pos.Y; e.tData = now; e.tSeen = now;
  }
}

// НПС (sysShipsSim, снимок раз в игровой день): курс — по своему пути на карте,
// скорость — по смещению между суточными снимками.
let cabinSimT = 0; // время прошлого снимка НПС
function cabinObserveSim(now) {
  const dtDay = cabinSimT ? Math.max(1, (now - cabinSimT) / 1000) : 0;
  for (let i = 0; i < sysShipsSim.length; i++) {
    const o = sysShipsSim[i];
    if (!o || typeof o.x !== "number" || typeof o.y !== "number") continue;
    const role = SIM_KIND_ROLE[o.k] || "trader";
    const e = cabinGet("S" + (o.id != null ? o.id : "#" + i), role,
                       SIM_COLORS[o.k] || "#888", CABIN_ROLE_MODEL[role]);
    e.sys = true;
    if (o.id != null) { e.id = o.id; e.label = role + " #" + o.id; }
    if (typeof o.tx === "number" && typeof o.ty === "number") {
      const ddx = o.tx - o.x, ddy = o.ty - o.y;
      const len = Math.hypot(ddx, ddy);
      if (len > 1e-6) { e.ndx = ddx / len; e.ndy = ddy / len; }
      e.txd = len;
    }
    if (dtDay && e.tData) {
      const v = Math.hypot(o.x - e.wx, o.y - e.wy) / dtDay;
      e.spd = (v > 1e-6 && v < 0.5) ? v : 0;
    }
    e.vx = e.ndx * e.spd; e.vy = e.ndy * e.spd;
    e.wx = o.x; e.wy = o.y; e.tData = now; e.tSeen = now;
  }
  cabinSimT = now;
}

// Расчёт реального трафика для отрисовки (вызывается из drawCobra в cabin).
// Здесь вся математика: dead reckoning, сглаживание, курс → yaw, выбор
// «каркас или точка». Возвращает список для отрисовки.
function cabinRealShips(nowMs) {
  const out = [];
  if (!cabinView) return out;
  const { spx, spy, dx, dy, horizonY, cx, cy, W, H } = cabinView;
  for (const e of cabinLive.values()) {
    const staleMs = e.sys ? 120000 : 10000; // НПС приходят снимком раз в игровой день, игроки — раз в секунду
    if (nowMs - e.tSeen > staleMs) { cabinLive.delete(e.key); continue; } // пропал с карты
    if (!e.sys && shipData && e.id === shipData.shipId) continue;       // свой корабль
    // dead reckoning: летим по последней скорости от последнего снимка карты
    const dtE = Math.min(5, (nowMs - e.tData) / 1000);
    let wx = e.wx + e.vx * dtE, wy = e.wy + e.vy * dtE;
    if (e.sys && e.spd > 0 && e.txd != null) {
      const step = Math.min(e.spd * dtE, e.txd); // НПС не летит дальше своей цели
      wx = e.wx + e.ndx * step; wy = e.wy + e.ndy * step;
    }
    // Та же проекция, что у точек/планет: вперёд по курсу, вбок — правый борт.
    const rx = wx - spx, ry = wy - spy;
    const z = rx * dx + ry * dy;                  // глубина (вперёд), ед. карты
    const x = ry * dx - rx * dy;                  // вправо
    if (z < 0.05) continue;                       // позади камеры
    const y = -(horizonY - cy) * z / CABIN_FOV;   // в плоскости «горизонта» (как точки)
    const spanPx = e.span * e.model.scale * CABIN_SHIP_K * CABIN_FOV / z;
    const sx = cx + x * CABIN_FOV / z;
    const onScreen = sx + spanPx / 2 > -10 && sx - spanPx / 2 < W + 10 && spanPx >= 6;
    // Курс корабля относительно нашего → yaw модели (нос = +z):
    // попутный 0, встречный π, справа +π/2, слева −π/2.
    const dot = dx * e.ndx + dy * e.ndy;
    const crs = dx * e.ndy - dy * e.ndx;
    const yawT = Math.atan2(crs, dot);
    // Сглаживание позиции и разворота — без рывков при обновлении данных.
    if (!e.pos) e.pos = [x, y, z];
    e.pos[0] += (x - e.pos[0]) * 0.12;
    e.pos[1] += (y - e.pos[1]) * 0.12;
    e.pos[2] += (z - e.pos[2]) * 0.12;
    let dyaw = yawT - e.yaw;
    if (dyaw >  Math.PI) dyaw -= Math.PI * 2;
    if (dyaw < -Math.PI) dyaw += Math.PI * 2;
    e.yaw += dyaw * 0.1;
    out.push({
      e, yaw: e.yaw, sx, spanPx, onScreen, dotY: horizonY,
      pos: [e.pos[0] * CABIN_CAM_K, e.pos[1] * CABIN_CAM_K, e.pos[2] * CABIN_CAM_K],
      skipNear: z * CABIN_CAM_K - e.span * e.model.scale * CABIN_SHIP_K * CABIN_CAM_K < 15
    });
  }
  return out;
}

let cobraAltitude = 5.0;    // высота — FLOAT: плавный шаг W/S + набор от Pitch и скорости
const COBRA_ALT_MIN = 1;    // минимальная высота
const COBRA_ALT_MAX = 15;   // максимальная высота
const COBRA_ALT_STEP = 0.25; // шаг W/S за кадр (~15 ед/с — плавно, а не рывком)

// planet: локальное состояние (не серверное, к карте системы отношения нет)
let cobraPitchOffset = 0;   // наклон носа от F/R: F — нос ВВЕРХ (в минус), R — ВНИЗ (в плюс), 0 = база (автовозврат)
let cobraRollOffset = 0;    // угол крена модели по roll — чистый визуал, на полёт не влияет
let cobraRollVel = 0;       // скорость крена: держишь N/M — приращение; отпустил — стоп, угол плавно возвращается к нулю
let cobraBank = 0;          // банк-крен от стрейфа A/D (как в файле игрока) — отдельная компонента ПОВЕРХ ручного крена
let cobraStrafeVel = 0;     // скорость стрейфа (вбок) — плавный разгон/торможение, A/D
// Взлёт (T): преп — «ещё больше задираем нос» (в минус, как у F), затем анимация кругами
let cobraTakeoffPrep = 0;   // performance.now() старта препа (0 = не запущен)
let cobraTakeoffPitch = 0;  // текущий доп. задир носа во время препа (≤ 0 — минус = нос вверх)
let cobraTakeoffStart = 0;  // performance.now() старта анимации взлёта
let cobraLocalX = 0;        // локальные координаты, тор 1000x1000, центр в (0,0)
let cobraLocalY = 0;
const COBRA_PITCH_STEP  = 0.02;   // шаг наклона за кадр
const COBRA_PITCH_MAX   = 0.30;   // предел наклона (рад)
const COBRA_STRAFE_VMAX = 0.06;    // макс. скорость стрейфа за кадр (эквивалент скорости хода 3)
const COBRA_STRAFE_ACC  = 0.0015;  // разгон стрейфа за кадр: 0→макс ~0.7 с (плавно)
const COBRA_ROLL_ACC  = 0.0008;    // приращение скорости крена за кадр при удержании N/M
const COBRA_ROLL_VMAX = 0.04;      // предел скорости крена за кадр (~0.4 об/с при 60 fps)
const COBRA_ROLL_BACK = 0.02;      // скорость автовозврата крена к нулю за кадр (половина VMAX)
const COBRA_LOCAL_SIZE  = 1000;   // тор 1000x1000, закольцовано; координаты в −500..+500

// Тор-обёртка: координата → диапазон −SIZE/2 .. +SIZE/2. Шов — на ±500, а НЕ на нуле:
// старт (0,0) и станция (0,75) далеко от шва — «чуть сместиться влево от нуля»
// больше ничего не ломает (x станет −0.5, без скачка через шов).
function cobraWrap(v) {
  return ((v + COBRA_LOCAL_SIZE / 2) % COBRA_LOCAL_SIZE + COBRA_LOCAL_SIZE) % COBRA_LOCAL_SIZE
       - COBRA_LOCAL_SIZE / 2;
}

// Скорость полёта 0..10: Z (+1), X (−1), C (стоп). Дискретно, по нажатию клавиши.
let cobraSpeed = 0;
const COBRA_SPEED_MAX = 10;
const COBRA_STAR_K = 0.8;   // поток набегающих звёзд за кадр = cobraSpeed * K
const COBRA_MOVE_K  = 0.02; // ход вперёд за кадр = cobraSpeed * K (локальный тор)

function drawCobra() {
  const W = cobraCanvas.width, H = cobraCanvas.height;
  cobraCtx.fillStyle = "#000";
  cobraCtx.fillRect(0, 0, W, H);

  const cx = W / 2, cy = H / 2;

  // Звёзды (медленно дрейфуют для атмосферы).
  cobraCtx.fillStyle = "#888";
  for (const s of cobraStars) {
    if (s[2] <= 1) continue;
    const sx = cx + (s[0] * COBRA_FOV) / s[2];
    const sy = cy - (s[1] * COBRA_FOV) / s[2];
    if (sx < 0 || sx >= W || sy < 0 || sy >= H) continue;
    const size = Math.max(1, (1 - s[2] / 1400) * 2);
    cobraCtx.fillRect(sx, sy, size, size);
  }

  // Применяем мировой поворот к матрице модели: yaw вокруг Y, затем фиксированный pitch вокруг X.
  const yaw = cobraShip.yaw, pitch = cobraShip.pitch;
  const rx = rotVecY([1, 0, 0], yaw), ry = rotVecY([0, 1, 0], yaw), rz = rotVecY([0, 0, 1], yaw);
  const mx = rotVecX(rx, pitch), my = rotVecX(ry, pitch), mz = rotVecX(rz, pitch);
  const m = { x: mx, y: my, z: mz };

  const pos = cobraShip.pos;
  if (pos[2] <= 20) return;

  if (cobraMode === "orbit") {
    // Coriolis-станция на фоне, за коброй (рисуем первой — она дальше).
    // Наводка строго на камеру: торец со слотом смотрит в центр экрана.
    const stYaw = Math.atan2(-cobraStation.pos[0], -cobraStation.pos[2]);
    const stPitch = Math.atan2(-cobraStation.pos[1], cobraStation.pos[2]);
    drawEliteModel(CORIOLIS, cobraStation.pos, stYaw, stPitch, cobraStation.roll, "#00cc88", 1.2);

    // Модель корабля: V — ротация (кобра → Python → Viper → Mamba → Sidewinder)
    const ship3d = cobraShipModel;
    const projected = ship3d.vertices.map(v => {
      const wx = pos[0] + v[0] * ship3d.scale * m.x[0] + v[1] * ship3d.scale * m.y[0] + v[2] * ship3d.scale * m.z[0];
      const wy = pos[1] + v[0] * ship3d.scale * m.x[1] + v[1] * ship3d.scale * m.y[1] + v[2] * ship3d.scale * m.z[1];
      const wz = pos[2] + v[0] * ship3d.scale * m.x[2] + v[1] * ship3d.scale * m.y[2] + v[2] * ship3d.scale * m.z[2];
      const scale = COBRA_FOV / Math.max(1, wz);
      return [cx + wx * scale, cy - wy * scale];
    });

    const faceVisible = ship3d.faces.map(n => {
      const nx = n[0] * m.x[0] + n[1] * m.y[0] + n[2] * m.z[0];
      const ny = n[0] * m.x[1] + n[1] * m.y[1] + n[2] * m.z[1];
      const nz = n[0] * m.x[2] + n[1] * m.y[2] + n[2] * m.z[2];
      const dot = pos[0] * nx + pos[1] * ny + pos[2] * nz;
      return dot < 0;
    });

    cobraCtx.strokeStyle = "#00ff88";
    cobraCtx.lineWidth = 1.4;
    cobraCtx.beginPath();
    for (const [v1, v2, f1, f2] of ship3d.edges) {
      if (faceVisible[f1] || faceVisible[f2]) {
        cobraCtx.moveTo(projected[v1][0], projected[v1][1]);
        cobraCtx.lineTo(projected[v2][0], projected[v2][1]);
      }
    }
    cobraCtx.stroke();
  } else if (cobraMode === "undock") {
    // Анимация отстыковки: 12 прямоугольников, 2^n
    const t = Math.min(1, (performance.now() - cobraUndockStart) / 1000 / COBRA_UNDOCK_DUR);
    cobraCtx.strokeStyle = "#00ff88";
    cobraCtx.lineWidth = 1.5;
    for (let n = 0; n < 12; n++) {
      // 2^n: дальние — реже, ближние — чаще; к концу — «разлетаются» от центра
      const base = Math.pow(2, n) * 0.5;
      const dist = base * (0.2 + t * 1.8); // растёт со временем → «набегают»
      const w = Math.max(4, dist * 0.6);
      const h = Math.max(3, dist * 0.4);
      cobraCtx.strokeRect(cx - w / 2, cy - h / 2, w, h);
    }
  } else if (cobraMode === "dock") {
    // Анимация стыковки — ТА ЖЕ, что на старте (undock): 12 прямоугольников 2^n
    const t = Math.min(1, (performance.now() - cobraDockStart) / 1000 / COBRA_DOCK_DUR);
    cobraCtx.strokeStyle = "#00ff88";
    cobraCtx.lineWidth = 1.5;
    for (let n = 0; n < 12; n++) {
      // 2^n: дальние — реже, ближние — чаще; к концу — «разлетаются» от центра
      const base = Math.pow(2, n) * 0.5;
      const dist = base * (0.2 + t * 1.8); // растёт со временем → «набегают»
      const w = Math.max(4, dist * 0.6);
      const h = Math.max(3, dist * 0.4);
      cobraCtx.strokeRect(cx - w / 2, cy - h / 2, w, h);
    }
    cobraCtx.fillStyle = "#aaa";
    cobraCtx.font = "11px monospace";
    cobraCtx.textAlign = "center";
    cobraCtx.textBaseline = "top";
    cobraCtx.fillText("docking...", cx, 24);
    cobraCtx.textAlign = "left";
  } else if (cobraMode === "takeoff") {
    // Анимация взлёта: та же логика 2^n, что у undock/dock, но КРУГИ вместо квадратов
    const t = Math.min(1, (performance.now() - cobraTakeoffStart) / 1000 / COBRA_TAKEOFF_DUR);
    cobraCtx.strokeStyle = "#ffaa33";
    cobraCtx.lineWidth = 1.5;
    for (let n = 0; n < 12; n++) {
      const base = Math.pow(2, n) * 0.5;
      const dist = base * (0.2 + t * 1.8); // растёт со временем → «набегают»
      cobraCtx.beginPath();
      cobraCtx.arc(cx, cy, Math.max(3, dist * 0.4), 0, Math.PI * 2);
      cobraCtx.stroke();
    }
    cobraCtx.fillStyle = "#aaa";
    cobraCtx.font = "11px monospace";
    cobraCtx.textAlign = "center";
    cobraCtx.textBaseline = "top";
    cobraCtx.fillText("takeoff...", cx, 24);
    cobraCtx.textAlign = "left";
  } else {
    // cabin: набегающие звёзды (фоновый параллакс)
    cobraCtx.fillStyle = "#aaaaaa";
    for (const [x, y, z] of cabinStars) {
      if (z <= 1) continue;
      const sx = cx + (x * CABIN_FOV) / z;
      const sy = cy - (y * CABIN_FOV) / z;
      if (sx < 0 || sx >= W || sy < 0 || sy >= H) continue;
      const size = Math.max(1, (1 - z / 1600) * 2.5);
      cobraCtx.fillRect(sx, sy, size, size);
    }

    // Реальные объекты системы — звезда + планеты + корабли + маркер цели.
    // Проекция: 2D мировые координаты → 3D cabine. Направление взгляда = курс движения.
    // В planet весь блок скрыт (звезда/планеты/корабли): else-блок общий для cabin
    // и planet, поэтому всё прячется одним условием cobraMode !== "planet".
    if (cobraMode !== "planet" && sysData && shipData) {
      const spx = shipData.pos.X, spy = shipData.pos.Y;

      // Курс движения: к target если есть, иначе — к звезде (0,0).
      let dx = -spx, dy = -spy;
      if (shipData.target) { dx = shipData.target.X - spx; dy = shipData.target.Y - spy; }
      const dlen = Math.hypot(dx, dy);
      if (dlen < 1e-4) { dx = 1; dy = 0; } else { dx /= dlen; dy /= dlen; }

      // Горизонт чуть ниже центра экрана (камера слегка смотрит вниз).
      const horizonY = cy + 40;

      // Параметры вида для расчёта реального трафика (cabinRealShips ниже).
      cabinView = { spx, spy, dx, dy, horizonY, cx, cy, W, H };

      function project(objX, objY) {
        const rx = objX - spx, ry = objY - spy;
        const forward = rx * dx + ry * dy;       // вдоль взгляда
        const side    = ry * dx - rx * dy;       // перпендикулярно (правый борт; canvas Y вниз)
        if (forward < 0.05) return null;          // позади камеры или слишком близко
        const screenX = cx + (side * CABIN_FOV) / forward;
        return { x: screenX, y: horizonY, forward };
      }

      // Звезда системы (большой жёлтый диск с glow).
      const sp = project(0, 0);
      if (sp) {
        const r = Math.max(4, 30 / sp.forward);
        const grad = cobraCtx.createRadialGradient(sp.x, sp.y, 0, sp.x, sp.y, r * 5);
        grad.addColorStop(0,   "rgba(255,247,160,1)");
        grad.addColorStop(0.18,"rgba(255,200,80,0.9)");
        grad.addColorStop(0.45,"rgba(201,162,39,0.45)");
        grad.addColorStop(1,   "rgba(201,162,39,0)");
        cobraCtx.fillStyle = grad;
        cobraCtx.fillRect(sp.x - r*5, sp.y - r*5, r*10, r*10);
        cobraCtx.beginPath();
        cobraCtx.arc(sp.x, sp.y, r, 0, Math.PI*2);
        cobraCtx.fillStyle = "#fff7a0";
        cobraCtx.fill();
      }

      // Планеты на орбитах (позиция зависит от worldDay — движутся раз в день).
      for (const p of sysData.planets) {
        const pos = getPlanetPosJS(p, worldDay, sysData.starId);
        const pp = project(pos.x, pos.y);
        if (!pp) continue;
        const r = Math.max(1.5, 10 / pp.forward);
        let color = "#888";
        if (p.habitable && p.race >= 0 && p.race < 5) color = PLANET_COLORS[p.race];
        cobraCtx.beginPath();
        cobraCtx.arc(pp.x, pp.y, r, 0, Math.PI*2);
        cobraCtx.fillStyle = color;
        cobraCtx.fill();
        // Подпись для близких планет.
        if (pp.forward < 5 && r > 3) {
          cobraCtx.fillStyle = "#aaa";
          cobraCtx.font = "10px monospace";
          cobraCtx.textAlign = "center";
          cobraCtx.textBaseline = "top";
          cobraCtx.fillText("p" + p.id, pp.x, pp.y + r + 4);
          cobraCtx.textAlign = "left";
        }
      }

      // Маркер цели (если есть shipData.target).
      if (shipData.target) {
        const tp = project(shipData.target.X, shipData.target.Y);
        if (tp) {
          cobraCtx.strokeStyle = "#0f8";
          cobraCtx.lineWidth = 1;
          cobraCtx.beginPath();
          cobraCtx.arc(tp.x, tp.y, 8, 0, Math.PI*2);
          cobraCtx.stroke();
          cobraCtx.beginPath();
          cobraCtx.moveTo(tp.x - 12, tp.y); cobraCtx.lineTo(tp.x - 4, tp.y);
          cobraCtx.moveTo(tp.x + 4, tp.y);  cobraCtx.lineTo(tp.x + 12, tp.y);
          cobraCtx.moveTo(tp.x, tp.y - 12); cobraCtx.lineTo(tp.x, tp.y - 4);
          cobraCtx.moveTo(tp.x, tp.y + 4);  cobraCtx.lineTo(tp.x, tp.y + 12);
          cobraCtx.stroke();
        }
      }

      // Корабли из данных карты: python — игроки, viper/sidewinder/mamba — НПС
      // (trader/caravan/pirate). Каркас — когда корабль в кадре; за краем экрана
      // рисуем его точку (та же, что на карте системы).
      for (const s of cabinRealShips(performance.now())) {
        if (!s.onScreen || s.skipNear) {
          cobraCtx.beginPath();
          cobraCtx.arc(s.sx, s.dotY, s.e.sys ? 1.5 : 2, 0, Math.PI * 2);
          cobraCtx.fillStyle = s.e.color;
          cobraCtx.fill();
          continue;
        }
        drawEliteModel(s.e.model, s.pos, s.yaw, 0, 0, s.e.color, 1.2, CABIN_FOV,
                       CABIN_SHIP_K * CABIN_CAM_K);
        // Подпись роли под кораблём (видна, когда корабль достаточно крупный)
        const lblY = s.dotY + s.spanPx / 2 + 6;
        if (s.spanPx > 26 && lblY > 0 && lblY < H) {
          cobraCtx.fillStyle = "#888";
          cobraCtx.font = "9px monospace";
          cobraCtx.textAlign = "center";
          cobraCtx.textBaseline = "top";
          cobraCtx.fillText(s.e.label, s.sx, lblY);
          cobraCtx.textAlign = "left";
        }
      }

      // Линия горизонта (тонкая, для ориентации).
        //cobraCtx.strokeStyle = "rgba(60,60,60,0.5)";
        //cobraCtx.lineWidth = 1;
        //cobraCtx.beginPath();
        //cobraCtx.moveTo(0, horizonY); cobraCtx.lineTo(W, horizonY);
        //cobraCtx.stroke();
    }
  }

  // === planet: орбитальный полёт — планета внизу, кобра в центре, орбита-эллипс ===
  if (cobraMode === "planet") {
    // 1. Фон: звёзды
    cobraCtx.fillStyle = "#888";
    for (const s of cabinStars) {
      if (s[2] <= 1) continue;
      const sx = cx + (s[0] * CABIN_FOV) / s[2];
      const sy = cy - (s[1] * CABIN_FOV) / s[2];
      if (sx < 0 || sx >= W || sy < 0 || sy >= H) continue;
      const size = Math.max(1, (1 - s[2] / 1600) * 2);
      cobraCtx.fillRect(sx, sy, size, size);
    }

    // 2. Планета внизу (эллипс-горизонт, только контур)
    let planetColor = "#55c855";
    if (selected && selected.kind === "planet" && sysData) {
      const p = sysData.planets.find(pp => pp.id === selected.id);
      if (p && p.habitable && p.race >= 0 && p.race < 5) planetColor = PLANET_COLORS[p.race];
    } else if (sysData && planet) {
      const p = sysData.planets.find(pp => pp.id === planet.id);
      if (p && p.habitable && p.race >= 0 && p.race < 5) planetColor = PLANET_COLORS[p.race];
    }

    const horizonRy = H * 0.30;
    const horizonY = H + horizonRy * 0.5;
    const horizonRx = W * 0.55;
    // Без заливки: только контур эллипса на полу (цвет — цвет планеты).
    cobraCtx.strokeStyle = planetColor;
    cobraCtx.lineWidth = 1.5;
    cobraCtx.beginPath();
    cobraCtx.ellipse(cx, horizonY, horizonRx, horizonRy, 0, 0, Math.PI*2);
    cobraCtx.stroke();
    cobraCtx.lineWidth = 1;

    // 3. Два эллипса (орбиты/эклиптика)
    const rX = W * 0.60; // радиус по X
    const rY = H * 0.15; // радиус по Y (сплющенность)
    const offsetY = H * 0.0; // сдвиг эллипсов от центра
        
        const compassShiftY = 220; // <-- сдвиг только компаса (Солнце, Луна, планеты) вниз

    // Северный эллипс (верхняя половина)
  //  cobraCtx.beginPath();
  //  cobraCtx.ellipse(cx, cy + offsetY, rX, rY, 0, Math.PI, Math.PI * 2);
  //  cobraCtx.strokeStyle = "rgba(100, 150, 255, 0.3)"; // Синеватый
  //  cobraCtx.lineWidth = 1;
  //  cobraCtx.stroke();

    // Южный эллипс (нижняя половина)
 //   cobraCtx.beginPath();
 //   cobraCtx.ellipse(cx, cy - offsetY, rX, rY, 0, 0, Math.PI);
 //   cobraCtx.strokeStyle = "rgba(100, 150, 255, 0.3)";
 //   cobraCtx.lineWidth = 1;
 //   cobraCtx.stroke();

    // 4. Солнце (Север) — смещается при повороте
    const sunAngle = -Math.PI / 2 - cameraYaw;
    const sunX = cx + rX * Math.cos(sunAngle);
    const sunY = (cy + offsetY + compassShiftY + cobraAltitude) + rY * Math.sin(sunAngle);
    // (код отрисовки SunGrad остается без изменений)
    const sunGrad = cobraCtx.createRadialGradient(sunX, sunY, 0, sunX, sunY, 20);
    sunGrad.addColorStop(0, "#fff7a0");
    sunGrad.addColorStop(0.5, "#ffcc00");
    sunGrad.addColorStop(1, "rgba(255, 200, 80, 0)");
    cobraCtx.fillStyle = sunGrad;
    cobraCtx.beginPath(); cobraCtx.arc(sunX, sunY, 20, 0, Math.PI*2); cobraCtx.fill();
    cobraCtx.fillStyle = "#fff"; cobraCtx.beginPath(); cobraCtx.arc(sunX, sunY, 4, 0, Math.PI*2); cobraCtx.fill();

    // 5. Луна (Юг) — смещается в противоположную сторону
    const moonAngle = Math.PI / 2 - cameraYaw;
    const moonX = cx + rX * Math.cos(moonAngle);
    const moonY = (cy - offsetY + compassShiftY + cobraAltitude) + rY * Math.sin(moonAngle);
    // (код отрисовки Луны остается без изменений)
    cobraCtx.fillStyle = "#ccc"; 
    cobraCtx.beginPath(); cobraCtx.arc(moonX, moonY, 6, 0, Math.PI*2); cobraCtx.fill();
    // Тёмная сторона луны (полумесяц)
    cobraCtx.fillStyle = "#444"; 
    cobraCtx.beginPath(); cobraCtx.arc(moonX - 2, moonY - 1, 6, 0, Math.PI*2); cobraCtx.fill();
    cobraCtx.fillStyle = "#ccc"; 
    cobraCtx.beginPath(); cobraCtx.arc(moonX + 1, moonY + 1, 5, 0, Math.PI*2); cobraCtx.fill();

    // 5.5 Станция на компасе: метка-ромб на СВОЁМ невидимом эллипсе (трек целиком
    // в кадре при любом пеленге — трек Солнце/Луна уходит за экран сбоку и снизу).
    // Пеленг на станцию (кратчайший путь тора) → угол на эллипсе:
    // прямо по курсу — верх, сзади — низ (как у планет: «впереди = верхняя половина»).
    {
      const svC = cobraStationVec();
      const stRx = W * 0.42, stRy = H * 0.14;           // свой эллипс метки: весь в кадре
      // Центр трека: (alt − MAX) компенсирует «дыхание» компаса — на макс. высоте
      // метка не наезжает на нос кобры (корабль не двигается, а компас уезжает вниз).
      const stBase = cy + compassShiftY * 0.42 + (cobraAltitude - COBRA_ALT_MAX);
      const stAng = -Math.PI / 2 + Math.atan2(svC.side, svC.fwd);
      const stMX = cx + stRx * Math.cos(stAng);
      const stMY = stBase + stRy * Math.sin(stAng);
      const stAhead = Math.sin(stAng) < 0; // впереди = верхняя половина (как у планет)
      cobraCtx.globalAlpha = stAhead ? 1 : 0.35;
      cobraCtx.strokeStyle = "#00cc88";
      cobraCtx.beginPath(); // ромб — только линии, без заливки
      cobraCtx.moveTo(stMX, stMY - 5);
      cobraCtx.lineTo(stMX + 5, stMY);
      cobraCtx.lineTo(stMX, stMY + 5);
      cobraCtx.lineTo(stMX - 5, stMY);
      cobraCtx.closePath();
      cobraCtx.stroke();
      if (stAhead) {
        cobraCtx.fillStyle = "#00cc88";
        cobraCtx.font = "9px monospace";
        cobraCtx.textAlign = "center";
        cobraCtx.fillText("st " + Math.hypot(svC.fwd, svC.side).toFixed(1), stMX, stMY - 8);
        cobraCtx.textAlign = "left";
      }
      cobraCtx.globalAlpha = 1;
    }

    // 6. Проекция карты системы: звезда = север, планеты по реальным орбитам.
    // Корабль «стоит» на домашней планете; серверные координаты не трогаем —
    // всё считается локально из sysData (формула орбит + worldDay).
    if (sysData && sysData.planets.length > 0) {
      const homeP = sysData.planets.find(pp => pp.id === planetID) || sysData.planets[0];
      const shipPos = getPlanetPosJS(homeP, worldDay, sysData.starId);
      const angStar = Math.atan2(-shipPos.y, -shipPos.x); // направление на звезду
      const compY = (cy + offsetY + compassShiftY + cobraAltitude);
      const prX = W * 0.44; // чуть уже эллипса компаса — все планеты остаются в кадре

      for (const p of sysData.planets) {
        if (p.id === homeP.id) continue; // своя планета — под ногами (горизонт внизу)
        const op = getPlanetPosJS(p, worldDay, sysData.starId);
        const dist = Math.hypot(op.x - shipPos.x, op.y - shipPos.y);
        if (dist < 0.01) continue;
        // Пеленг планеты относительно направления на звезду (звезда = север)
        let rel = Math.atan2(op.y - shipPos.y, op.x - shipPos.x) - angStar;
        rel = Math.atan2(Math.sin(rel), Math.cos(rel)); // нормализация -PI..PI
        const screenAng = sunAngle + rel;
        const px = cx + prX * Math.cos(screenAng);
        const py = compY + rY * Math.sin(screenAng);

        // Впереди = верхняя половина эллипса компаса — крупнее и ярче
        const ahead = Math.sin(screenAng) < 0;
        const r = Math.max(2, Math.min(6, 9 / dist)); // чем ближе, тем крупнее
        let color = "#888";
        if (p.habitable && p.race >= 0 && p.race < 5) color = PLANET_COLORS[p.race];

        cobraCtx.globalAlpha = ahead ? 1 : 0.35;
        cobraCtx.fillStyle = color;
        cobraCtx.beginPath();
        cobraCtx.arc(px, py, ahead ? r : Math.max(1.5, r * 0.6), 0, Math.PI*2);
        cobraCtx.fill();
        // Выбранная планета (set на карте) — белое кольцо
        if (selected && selected.kind === "planet" && selected.id === p.id) {
          cobraCtx.strokeStyle = "#fff";
          cobraCtx.lineWidth = 1.5;
          cobraCtx.beginPath();
          cobraCtx.arc(px, py, r + 3.5, 0, Math.PI*2);
          cobraCtx.stroke();
          cobraCtx.lineWidth = 1;
        }
        if (ahead) {
          cobraCtx.fillStyle = "#aaa";
          cobraCtx.font = "9px monospace";
          cobraCtx.textAlign = "center";
          cobraCtx.textBaseline = "top";
          cobraCtx.fillText("p" + p.id + " " + dist.toFixed(1), px, py + r + 3);
          cobraCtx.textAlign = "left";
        }
        cobraCtx.globalAlpha = 1;
      }
    }

    // 6.5 Станция на сетке (тор 1000x1000): фиксированная ячейка, размер от дистанции.
    // «Камерные» координаты: side — вбок, fwd — вперёд по курсу камеры.
    // Вектор — по кратчайшему пути тора: видна сразу со старта (d=75) и до FAR=150.
    {
      const sv = cobraStationVec();
      const fwd = sv.fwd, side = sv.side;
      if (fwd >= COBRA_STATION_NEAR && fwd <= COBRA_STATION_FAR) {
        // Высота: уровень взгляда (cy) с поправкой по Alt — набор высоты (W) опускает
        // станцию на экране вниз, снижение (S) поднимает, 1 ед. alt = 1 px (как у компаса).
        // Ориентация: yaw/pitch считаются из позиции станции — торец со слотом ВСЕГДА
        // смотрит строго в центр камеры (roll продолжает крутить слот на месте).
        // stHalf — полувысота каркаса (сечение — квадрат с полу-стороной 160):
        // 160*(|sin|+|cos|) roll — нужна только для позиции подписи над каркасом.
        const stHalf = 160 * CORIOLIS.scale
                     * (Math.abs(Math.sin(cobraStation.roll)) + Math.abs(Math.cos(cobraStation.roll)))
                     * COBRA_FOV / fwd;
        const stY = cy + cobraAltitude * COBRA_STATION_ALT_PX; // центр: линия взгляда + поправка по Alt
        const stWy = sv.vert;
        const stX = cx + side * COBRA_FOV / fwd;
        const stYaw = Math.atan2(-side, -fwd);   // наводка на камеру: горизонталь
        const stPitch = Math.atan2(-stWy, fwd);  // ... и вертикаль
        drawEliteModel(CORIOLIS, [side, stWy, fwd],
                       stYaw, stPitch, cobraStation.roll, "#00cc88", 1.2);
        // подпись с дистанцией (только текст, без эффектов)
        cobraCtx.fillStyle = "#aaa";
        cobraCtx.font = "9px monospace";
        cobraCtx.textAlign = "center";
        cobraCtx.fillText("station  d=" + fwd.toFixed(1), stX, stY - stHalf - 6);
        cobraCtx.textAlign = "left";
      }
    }

    // 7. Кобра (сзади, чуть сверху) — K прячет/показывает
    if (cobraShipVisible) {
    const yaw = 0; // Сзади
    const pitch = -0.25 + cobraPitchOffset + cobraTakeoffPitch; // Сверху + нос (F вверх/R вниз) + задир при взлёте (тоже в минус)
    const rx = rotVecY([1, 0, 0], yaw), ry = rotVecY([0, 1, 0], yaw), rz = rotVecY([0, 0, 1], yaw);
    const mx = rotVecX(rx, pitch), my = rotVecX(ry, pitch), mz = rotVecX(rz, pitch);
    // Крен модели: ручной (N/M, остаётся под углом) + банк от стрейфа A/D — сумма двух компонент
    const m = { x: rotVecZ(mx, cobraRollOffset + cobraBank), y: rotVecZ(my, cobraRollOffset + cobraBank), z: rotVecZ(mz, cobraRollOffset + cobraBank) };
    const shipCy = H * 0.65; // Кобра по центру, чуть ниже
    const pos = cobraShip.pos;
    const projected = COBRA_MK3.vertices.map(v => {
      const wx = pos[0] + v[0] * COBRA_MK3.scale * m.x[0] + v[1] * COBRA_MK3.scale * m.y[0] + v[2] * COBRA_MK3.scale * m.z[0];
      const wy = pos[1] + v[0] * COBRA_MK3.scale * m.x[1] + v[1] * COBRA_MK3.scale * m.y[1] + v[2] * COBRA_MK3.scale * m.z[1];
      const wz = pos[2] + v[0] * COBRA_MK3.scale * m.x[2] + v[1] * COBRA_MK3.scale * m.y[2] + v[2] * COBRA_MK3.scale * m.z[2];
      const scale = COBRA_FOV / Math.max(1, wz);
      return [cx + wx * scale, shipCy - wy * scale];
    });
    const faceVisible = COBRA_MK3.faces.map(n => {
      const nx = n[0] * m.x[0] + n[1] * m.y[0] + n[2] * m.z[0];
      const ny = n[0] * m.x[1] + n[1] * m.y[1] + n[2] * m.z[1];
      const nz = n[0] * m.x[2] + n[1] * m.y[2] + n[2] * m.z[2];
      const dot = pos[0] * nx + pos[1] * ny + pos[2] * nz;
      return dot < 0;
    });
    cobraCtx.strokeStyle = "#00ff88";
    cobraCtx.lineWidth = 1.4;
    cobraCtx.beginPath();
    for (const [v1, v2, f1, f2] of COBRA_MK3.edges) {
      if (faceVisible[f1] || faceVisible[f2]) {
        cobraCtx.moveTo(projected[v1][0], projected[v1][1]);
        cobraCtx.lineTo(projected[v2][0], projected[v2][1]);
      }
    }
    cobraCtx.stroke();
    } // cobraShipVisible
  }

  // Лёгкая телеметрия: если у нас есть свой корабль — покажем.
  if (shipData) {
    cobraCtx.fillStyle = "#888";
    cobraCtx.font = "11px monospace";
    cobraCtx.textAlign = "left";
    cobraCtx.textBaseline = "top";
    cobraCtx.fillText(
      "ship=" + shipData.shipId +
      " pos=(" + shipData.pos.X.toFixed(2) + "," + shipData.pos.Y.toFixed(2) + ")" +
      " eta=" + shipData.eta,
      8, 8
    );
  }

  // Отладка planet: все локальные переменные столбиком под "ship=...".
  // L — показать/скрыть этот лог внутри канваса.
  if (dbgVisible && (cobraMode === "planet" || cobraMode === "orbit")) {
    let cabP = 0, cabS = 0; // трафик кабины из данных карты: игроки + НПС
    for (const e of cabinLive.values()) { if (e.sys) cabS++; else cabP++; }
    const dbg = [
      "mode=" + cobraMode,
      "spd=" + cobraSpeed + " / " + COBRA_SPEED_MAX + "  (Z+ X- C=0)",
      "yaw=" + cameraYaw.toFixed(3),
      "alt=" + cobraAltitude.toFixed(1) + " (1..15  W/S)",
      "pitch=" + cobraPitchOffset.toFixed(3) + "  (F вверх / R вниз)",
      "roll=" + cobraRollOffset.toFixed(2) + " vel=" + cobraRollVel.toFixed(3) + "  (N/M крен: отпустил — плавный возврат к 0)",
      "bank=" + cobraBank.toFixed(3) + "  (банк от A/D)",
      "strafeV=" + cobraStrafeVel.toFixed(3) + "  (A/D вбок)",
      "localX=" + cobraLocalX.toFixed(2),
      "localY=" + cobraLocalY.toFixed(2),
      "shipYaw=" + cobraShip.yaw.toFixed(2),
      "shipPitch=" + cobraShip.pitch.toFixed(2),
      "cobra(K)=" + (cobraShipVisible ? "on" : "off"),
      "model=" + cobraShipModelName + " " + (cobraShipIdx + 1) + "/" + COBRA_SHIPS.length + "  (V — сменить)",
      "traffic=" + (cabP + cabS) + " (карта: игроки " + cabP + ", НПС " + cabS + ")",
    ];
    // Наводка на станцию: d — дистанция по курсу, hit — промах от центра.
    // Стыковка: d<=5 и hit<=0.1.
    if (cobraMode === "planet" || cobraMode === "dock") {
      const sv = cobraStationVec();
      dbg.push("st d=" + sv.fwd.toFixed(1) + " hit=" + Math.hypot(sv.side, sv.vert).toFixed(2) + "  (dock: d<=5 & hit<=0.1)");
    }
    // Взлёт: подсказка и таймер препа
    if (cobraMode === "planet") {
      if (cobraTakeoffPrep) {
        const tt = Math.max(0, COBRA_TAKEOFF_PREP - (performance.now() - cobraTakeoffPrep) / 1000);
        dbg.push("TAKEOFF " + tt.toFixed(1) + "s — держи F!");
      } else if (cobraAltitude >= COBRA_ALT_MAX - 0.01 && keys['KeyF']) {
        dbg.push("держи F и жми T — взлёт");
      }
    }
    cobraCtx.fillStyle = "#888";
    cobraCtx.font = "11px monospace";
    cobraCtx.textAlign = "left";
    cobraCtx.textBaseline = "top";
    for (let i = 0; i < dbg.length; i++) {
      cobraCtx.fillText(dbg[i], 8, 24 + i * 13);
    }
  }

  // FPS — правый верхний угол
  cobraCtx.fillStyle = "#00ff88";
  cobraCtx.font = "12px monospace";
  cobraCtx.textAlign = "right";
  cobraCtx.textBaseline = "top";
  cobraCtx.fillText("fps=" + cobraFps, W - 8, 8);
  cobraCtx.textAlign = "left";

  // Благодарность — внизу по центру, с миганием как "Press Space, Commander"
  if (Math.floor(performance.now() / 1800) % 2 === 0) {
    cobraCtx.fillStyle = "#2a7a4a";
    cobraCtx.font = "12px monospace";
    cobraCtx.textAlign = "center";
    cobraCtx.textBaseline = "bottom";
    cobraCtx.fillText("inspired by ELITE (1984) — D. Braben & I. Bell", W / 2, H - 10);
    cobraCtx.textAlign = "left";
    cobraCtx.textBaseline = "top";
  }
}

function cobraLoop() {
  if (cobraMode === "orbit") {
    cobraShip.yaw   += 0.012;
    cobraShip.pitch += 0.0045;
    cobraStation.roll += 0.004; // станция вращается вокруг собственной оси Z — слот крутится на месте
  } else if (cobraMode === "undock") {
    const elapsed = (performance.now() - cobraUndockStart) / 1000;
    if (elapsed >= COBRA_UNDOCK_DUR) {
      cobraMode = cobraAfterUndock; // отстыковка закончилась → cabin или planet
      cobraAfterUndock = "cabin";    // сброс
      if (cobraMode === "cabin") {
        for (const s of cabinStars) {
          s[0] = (Math.random() - 0.5) * 1600;
          s[1] = (Math.random() - 0.5) * 1600;
          s[2] = Math.random() * 1600 + 50;
        }
      }
    }
  } else if (cobraMode === "dock") {
    const elapsed = (performance.now() - cobraDockStart) / 1000;
    if (elapsed >= COBRA_DOCK_DUR) {
      // Стыковка завершена: сброс позиции и скорости игрока — и снова полёт.
      cobraMode = "planet";
      cobraLocalX = 0;
      cobraLocalY = 0;
      cobraSpeed = 0;
      cobraPitchOffset = 0;
      cobraRollOffset = 0;
      cobraRollVel = 0;
      cobraBank = 0;
      cobraStrafeVel = 0;
      cobraTakeoffPrep = 0;
      cobraTakeoffPitch = 0;
    }
  } else if (cobraMode === "takeoff") {
    const elapsed = (performance.now() - cobraTakeoffStart) / 1000;
    if (elapsed >= COBRA_TAKEOFF_DUR) {
      // Взлёт завершён (пока без самого взлёта): полный сброс — и снова полёт (повтор).
      cobraMode = "planet";
      cobraLocalX = 0;
      cobraLocalY = 0;
      cobraSpeed = 0;
      cobraPitchOffset = 0;
      cobraRollOffset = 0;
      cobraRollVel = 0;
      cobraBank = 0;
      cobraStrafeVel = 0;
      cobraTakeoffPitch = 0;
      cobraAltitude = COBRA_ALT_MIN;
    }
  } else if (cobraMode === "planet") {
    cobraStation.roll += 0.004; // станция крутится вокруг своей оси и в демке на сетке
    // Вращение обзора (камеры) по Q/E
    if (keys['KeyE']) cameraYaw += 0.01; // Вправо (Восток)
    if (keys['KeyQ']) cameraYaw -= 0.01; // Влево (Запад)
        
        if (keys['KeyW']) cobraAltitude += COBRA_ALT_STEP; // вверх (плавно, float)
    if (keys['KeyS']) cobraAltitude -= COBRA_ALT_STEP; // вниз
    // Вертикаль от тангажа и скорости: нос вверх (F) на ходу — набор, вниз (R) — снижение.
    // Нос вверх — это минус pitchOffset, поэтому набор со знаком «минус».
    // Наклон траектории = pitch (рад), поэтому K — тот же COBRA_MOVE_K.
    cobraAltitude -= cobraPitchOffset * cobraSpeed * COBRA_MOVE_K;
    // Ограничение высоты 1..15
    if (cobraAltitude < COBRA_ALT_MIN) cobraAltitude = COBRA_ALT_MIN;
    if (cobraAltitude > COBRA_ALT_MAX) cobraAltitude = COBRA_ALT_MAX;

    // Pitch: F — нос вверх (в минус), R — вниз (в плюс); отпустил — плавный возврат к базе (по кадру).
    if (keys['KeyR']) cobraPitchOffset += COBRA_PITCH_STEP;
    if (keys['KeyF']) cobraPitchOffset -= COBRA_PITCH_STEP;
    if (!keys['KeyR'] && !keys['KeyF']) {
      const back = COBRA_PITCH_STEP * 1.5;   // возврат чуть быстрее наклона
      if (Math.abs(cobraPitchOffset) <= back) cobraPitchOffset = 0;
      else cobraPitchOffset -= Math.sign(cobraPitchOffset) * back;
    }
    if (cobraPitchOffset >  COBRA_PITCH_MAX) cobraPitchOffset =  COBRA_PITCH_MAX;
    if (cobraPitchOffset < -COBRA_PITCH_MAX) cobraPitchOffset = -COBRA_PITCH_MAX;

    // Крен модели по оси roll: N/M — крутим ТОЛЬКО модельку (чистый визуал, на полёт
    // не влияет). Держишь — скорость вращения плавно нарастает (приращение за кадр);
    // отпустил — вращение СТОП, а сам угол крена плавно возвращается к нулю
    // (как у тангажа F/R: постоянная скорость возврата + доводка в ноль).
    if (keys['KeyN']) cobraRollVel += COBRA_ROLL_ACC; // влево
    if (keys['KeyM']) cobraRollVel -= COBRA_ROLL_ACC; // вправо
    if (!keys['KeyN'] && !keys['KeyM']) { // отпустил — стоп и плавный возврат к нулю
      cobraRollVel = 0;
      if (Math.abs(cobraRollOffset) <= COBRA_ROLL_BACK) cobraRollOffset = 0;
      else cobraRollOffset -= Math.sign(cobraRollOffset) * COBRA_ROLL_BACK;
    }
    if (cobraRollVel >  COBRA_ROLL_VMAX) cobraRollVel =  COBRA_ROLL_VMAX;
    if (cobraRollVel < -COBRA_ROLL_VMAX) cobraRollVel = -COBRA_ROLL_VMAX;
    cobraRollOffset += cobraRollVel; // вращаем модельку с текущей скоростью
    if (cobraRollOffset >  Math.PI) cobraRollOffset -= 2 * Math.PI; // угловая нормировка
    if (cobraRollOffset < -Math.PI) cobraRollOffset += 2 * Math.PI;

    // Стрейф (плавный): A — влево, D — вправо. Относительно поворота камеры.
    // Инерция: пока клавиша держится — разгон, отпустил — корабль ещё
    // скользит и плавно тормозит трением. Визуала у стрейфа нет — крен на N/M.
    const strafeDir = (keys['KeyD'] ? 1 : 0) - (keys['KeyA'] ? 1 : 0);
    if (strafeDir !== 0) {
      cobraStrafeVel += COBRA_STRAFE_ACC * strafeDir;
      if (cobraStrafeVel >  COBRA_STRAFE_VMAX) cobraStrafeVel =  COBRA_STRAFE_VMAX;
      if (cobraStrafeVel < -COBRA_STRAFE_VMAX) cobraStrafeVel = -COBRA_STRAFE_VMAX;
    } else {
      cobraStrafeVel *= 0.90; // трение: скольжение в остановку ~1.2 с
      if (Math.abs(cobraStrafeVel) < 0.001) cobraStrafeVel = 0;
    }
    if (cobraStrafeVel !== 0) {
      cobraLocalX += Math.cos(cameraYaw) * cobraStrafeVel;   // вправо (D) = плюс
      cobraLocalY -= Math.sin(cameraYaw) * cobraStrafeVel;
      cobraLocalX = cobraWrap(cobraLocalX);
      cobraLocalY = cobraWrap(cobraLocalY);
    }
    // Банк-крен от стрейфа (как в файле игрока): цель пропорциональна скорости
    // стрейфа (влево = плюс), плавно подтягивается к цели и так же плавно
    // возвращается в ноль после остановки. Отдельная компонента ПОВЕРХ ручного
    // крена N/M — ручной угол «остаётся под углом» и с банком не конфликтует.
    const bankTarget = -(cobraStrafeVel / COBRA_STRAFE_VMAX) * COBRA_PITCH_MAX;
    cobraBank += (bankTarget - cobraBank) * 0.12;
    if (Math.abs(cobraBank) < 0.0005) cobraBank = 0;
        
    // Ход вперёд со скоростью: по курсу камеры (север = +localY), тор 1000x1000
    if (cobraSpeed > 0) {
      cobraLocalX += Math.sin(cameraYaw) * COBRA_MOVE_K * cobraSpeed;
      cobraLocalY += Math.cos(cameraYaw) * COBRA_MOVE_K * cobraSpeed;
      cobraLocalX = cobraWrap(cobraLocalX);
      cobraLocalY = cobraWrap(cobraLocalY);
    }

    // Стыковка: дистанция до станции <= 5 И «попадание» относительно центра <= 0.1
    // (вбок + по высоте). Успех → анимация стыковки (как на старте); по её
    // завершении — сброс позиции и скорости, снова полёт (ветка "dock" выше).
    {
      const sv = cobraStationVec();
      if (Math.abs(sv.fwd) <= COBRA_DOCK_DIST && Math.hypot(sv.side, sv.vert) <= COBRA_DOCK_HIT) {
        cobraMode = "dock";
        cobraDockStart = performance.now();
      }
    }

    // Взлёт (T): пока преп идёт — F держится и высота на максимуме, нос «ещё больше»
    // задирается ВВЕРХ (в минус, как у F); через COBRA_TAKEOFF_PREP — анимация взлёта.
    // Отпустил F / потерял высоту — отмена.
    if (cobraTakeoffPrep) {
      if (cobraAltitude >= COBRA_ALT_MAX - 0.01 && keys['KeyF']) {
        const tp = (performance.now() - cobraTakeoffPrep) / 1000;
        cobraTakeoffPitch = -Math.min(COBRA_TAKEOFF_PITCH, tp / COBRA_TAKEOFF_PREP * COBRA_TAKEOFF_PITCH);
        if (tp >= COBRA_TAKEOFF_PREP) {
          cobraMode = "takeoff";
          cobraTakeoffStart = performance.now();
          cobraTakeoffPrep = 0;
          cobraTakeoffPitch = 0;
        }
      } else {
        cobraTakeoffPrep = 0; // отмена взлёта
        cobraTakeoffPitch = 0;
      }
    }

    // Набегающие звёзды: поток навстречу пропорционален скорости
    if (cobraSpeed > 0) {
      const flow = cobraSpeed * COBRA_STAR_K;
      for (const s of cabinStars) {
        s[2] -= flow;
        if (s[2] < 10) {
          s[0] = (Math.random() - 0.5) * 1600;
          s[1] = (Math.random() - 0.5) * 1600;
          s[2] = 1600;
        }
      }
    }
  } else {
    // cabin: звёзды летят на камеру
    for (const s of cabinStars) {
      s[2] -= cabinSpeed;
      if (s[2] < 10) {
        s[0] = (Math.random() - 0.5) * 1600;
        s[1] = (Math.random() - 0.5) * 1600;
        s[2] = 1600;
      }
    }
  }
  drawCobra();

  // FPS: считаем кадры, обновляем раз в ~500 мс
  cobraFrames++;
  const now = performance.now();
  if (now - cobraFpsLast >= 500) {
    cobraFps = Math.round(cobraFrames * 1000 / (now - cobraFpsLast));
    cobraFrames = 0;
    cobraFpsLast = now;
  }

  requestAnimationFrame(cobraLoop);
}
cobraLoop();


// --- старт ---
(async () => {
  await loadPlanet();
  buildRoomKeys();
  updateTabsState();
  switchRoom();
  if (planet) await loadSystem(planet.star);
  const sid = parseInt(localStorage.getItem("gs_ship_id") || "0", 10);
  if (sid) await loadShip(sid);
  pollShipByHour();          // <-- вместо pollDay()
  pollShipsBySystem();
  pollSystemObjects();       // корабли симуляции в системе (раз в игровой день)
  setInterval(drawSysMap, 1000);
})();
</script>
