<!DOCTYPE html>
<html lang="ru">
<head>
<meta charset="UTF-8">
<title>Elite 1984 — Canvas Wireframe Prototype</title>
<style>
  body { margin: 0; background: #000; color: #0f0; font-family: monospace; overflow: hidden; }
  canvas { display: block; }
  #hud { position: absolute; top: 15px; left: 15px; pointer-events: none; line-height: 1.5; }
</style>
</head>
<body>
<div id="hud">
  <b>ELITE 1984 ENGINE (CANVAS 2D)</b><br>
  W / S — Тангаж (Pitch)<br>
  A / D — Крен (Roll)<br>
  Q / E — Скорость (Thrust)<br>
  <span id="telemetry"></span>
</div>
<canvas id="screen"></canvas>

<script>
const canvas = document.getElementById('screen');
const ctx = canvas.getContext('2d');
const telemetry = document.getElementById('telemetry');

function resize() {
  canvas.width = window.innerWidth;
  canvas.height = window.innerHeight;
}
window.addEventListener('resize', resize);
resize();

// Cobra Mk III — вершины 1:1 из 6502-исходников (28 вершин)
// формат: [x, y, z]
const COBRA_MK3 = {
  vertices: [
    [ 32,   0,  76], // 0
    [-32,   0,  76], // 1
    [  0,  26,  24], // 2
    [-120, -3,  -8], // 3
    [120,  -3,  -8], // 4
    [-88,  16, -40], // 5
    [ 88,  16, -40], // 6
    [128,  -8, -40], // 7
    [-128, -8, -40], // 8
    [  0,  26, -40], // 9
    [-32, -24, -40], // 10
    [ 32, -24, -40], // 11
    [-36,   8, -40], // 12
    [ -8,  12, -40], // 13
    [  8,  12, -40], // 14
    [ 36,   8, -40], // 15
    [ 36, -12, -40], // 16
    [  8, -16, -40], // 17
    [ -8, -16, -40], // 18
    [-36, -12, -40], // 19
    [  0,   0,  76], // 20
    [  0,   0,  90], // 21
    [-80,  -6, -40], // 22
    [-80,   6, -40], // 23
    [-88,   0, -40], // 24
    [ 80,   6, -40], // 25
    [ 88,   0, -40], // 26
    [ 80,  -6, -40]  // 27
  ],
  // [v1, v2, face1, face2] — 38 рёбер
  edges: [
    [ 0,  1,  0, 11], // 0
    [ 0,  4,  4, 12], // 1
    [ 1,  3,  3, 10], // 2
    [ 3,  8,  7, 10], // 3
    [ 4,  7,  8, 12], // 4
    [ 6,  7,  8,  9], // 5
    [ 6,  9,  6,  9], // 6
    [ 5,  9,  5,  9], // 7
    [ 5,  8,  7,  9], // 8
    [ 2,  5,  1,  5], // 9
    [ 2,  6,  2,  6], // 10
    [ 3,  5,  3,  7], // 11
    [ 4,  6,  4,  8], // 12
    [ 1,  2,  0,  1], // 13
    [ 0,  2,  0,  2], // 14
    [ 8, 10,  9, 10], // 15
    [10, 11,  9, 11], // 16
    [ 7, 11,  9, 12], // 17
    [ 1, 10, 10, 11], // 18
    [ 0, 11, 11, 12], // 19
    [ 1,  5,  1,  3], // 20
    [ 0,  6,  2,  4], // 21
    [20, 21,  0, 11], // 22
    [12, 13,  9,  9], // 23
    [18, 19,  9,  9], // 24
    [14, 15,  9,  9], // 25
    [16, 17,  9,  9], // 26
    [15, 16,  9,  9], // 27
    [14, 17,  9,  9], // 28
    [13, 18,  9,  9], // 29
    [12, 19,  9,  9], // 30
    [ 2,  9,  5,  6], // 31
    [22, 24,  9,  9], // 32
    [23, 24,  9,  9], // 33
    [22, 23,  9,  9], // 34
    [25, 26,  9,  9], // 35
    [26, 27,  9,  9], // 36
    [25, 27,  9,  9]  // 37
  ],
  // нормали граней (13)
  faces: [
    [  0,  62,  31], // 0
    [-18,  55,  16], // 1
    [ 18,  55,  16], // 2
    [-16,  52,  14], // 3
    [ 16,  52,  14], // 4
    [-14,  47,   0], // 5
    [ 14,  47,   0], // 6
    [-61, 102,   0], // 7
    [ 61, 102,   0], // 8
    [  0,   0, -80], // 9
    [ -7, -42,   9], // 10
    [  0, -30,   6], // 11
    [  7, -42,   9]  // 12
  ]
};

function norm(v) {
  const len = Math.hypot(v[0], v[1], v[2]) || 1;
  return [v[0] / len, v[1] / len, v[2] / len];
}
function cross(a, b) {
  return [
    a[1] * b[2] - a[2] * b[1],
    a[2] * b[0] - a[0] * b[2],
    a[0] * b[1] - a[1] * b[0]
  ];
}
function tidyMatrix(m) {
  m.z = norm(m.z);
  m.x = norm(cross(m.y, m.z));
  m.y = cross(m.z, m.x);
}
function applyPlayerRotation(v, pitch, roll) {
  let x = v[0] * Math.cos(roll) - v[1] * Math.sin(roll);
  let y = v[0] * Math.sin(roll) + v[1] * Math.cos(roll);
  let z = v[2];
  let y2 = y * Math.cos(pitch) - z * Math.sin(pitch);
  let z2 = y * Math.sin(pitch) + z * Math.cos(pitch);
  return [x, y2, z2];
}

const targetShip = {
  pos: [0, 0, 400],
  rot: { x: [1, 0, 0], y: [0, 1, 0], z: [0, 0, 1] },
  blueprint: COBRA_MK3
};

const stars = Array.from({ length: 120 }, () => [
  (Math.random() - 0.5) * 1600,
  (Math.random() - 0.5) * 1600,
  Math.random() * 1600 + 50
]);

const keys = {};
window.addEventListener('keydown', e => keys[e.code] = true);
window.addEventListener('keyup', e => keys[e.code] = false);

let speed = 6;
const FOV = 450;

function update() {
  let pitch = 0, roll = 0;
  if (keys['KeyW']) pitch =  0.025;
  if (keys['KeyS']) pitch = -0.025;
  if (keys['KeyA']) roll  =  0.035;
  if (keys['KeyD']) roll  = -0.035;
  if (keys['KeyQ']) speed = Math.min(25, speed + 0.3);
  if (keys['KeyE']) speed = Math.max(0,  speed - 0.3);

  for (let s of stars) {
    s[2] -= speed;
    const r = applyPlayerRotation(s, pitch, roll);
    s[0] = r[0]; s[1] = r[1]; s[2] = r[2];
    if (s[2] < 10) {
      s[0] = (Math.random() - 0.5) * 1600;
      s[1] = (Math.random() - 0.5) * 1600;
      s[2] = 1600;
    }
  }

  targetShip.pos[2] -= speed * 0.4;
  if (targetShip.pos[2] < 180) targetShip.pos[2] = 900;
  targetShip.pos = applyPlayerRotation(targetShip.pos, pitch, roll);
  targetShip.rot.x = applyPlayerRotation(targetShip.rot.x, pitch, roll);
  targetShip.rot.y = applyPlayerRotation(targetShip.rot.y, pitch, roll);
  targetShip.rot.z = applyPlayerRotation(targetShip.rot.z, pitch, roll);

  const spin = 0.008;
  targetShip.rot.x = [
    targetShip.rot.x[0] + targetShip.rot.z[0] * spin,
    targetShip.rot.x[1] + targetShip.rot.z[1] * spin,
    targetShip.rot.x[2] + targetShip.rot.z[2] * spin
  ];
  tidyMatrix(targetShip.rot);
}

function drawShip(ship) {
  const { pos, rot, blueprint } = ship;
  if (pos[2] <= 20) return;

  const cx = canvas.width / 2;
  const cy = canvas.height / 2;

  const projected = blueprint.vertices.map(v => {
    const wx = pos[0] + v[0]*rot.x[0] + v[1]*rot.y[0] + v[2]*rot.z[0];
    const wy = pos[1] + v[0]*rot.x[1] + v[1]*rot.y[1] + v[2]*rot.z[1];
    const wz = pos[2] + v[0]*rot.x[2] + v[1]*rot.y[2] + v[2]*rot.z[2];
    const scale = FOV / Math.max(1, wz);
    return [cx + wx * scale, cy - wy * scale];
  });

  const faceVisible = blueprint.faces.map(n => {
    const nx = n[0]*rot.x[0] + n[1]*rot.y[0] + n[2]*rot.z[0];
    const ny = n[0]*rot.x[1] + n[1]*rot.y[1] + n[2]*rot.z[1];
    const nz = n[0]*rot.x[2] + n[1]*rot.y[2] + n[2]*rot.z[2];
    const dot = pos[0]*nx + pos[1]*ny + pos[2]*nz;
    return dot < 0;
  });

  ctx.strokeStyle = '#ffffff';
  ctx.lineWidth = 1.5;
  ctx.beginPath();
  for (const [v1, v2, f1, f2] of blueprint.edges) {
    if (faceVisible[f1] || faceVisible[f2]) {
      ctx.moveTo(projected[v1][0], projected[v1][1]);
      ctx.lineTo(projected[v2][0], projected[v2][1]);
    }
  }
  ctx.stroke();
}

function render() {
  ctx.fillStyle = '#000000';
  ctx.fillRect(0, 0, canvas.width, canvas.height);
  const cx = canvas.width / 2;
  const cy = canvas.height / 2;

  ctx.fillStyle = '#aaaaaa';
  for (const [x, y, z] of stars) {
    if (z <= 1) continue;
    const sx = cx + (x * FOV) / z;
    const sy = cy - (y * FOV) / z;
    const size = Math.max(1, (1 - z / 1600) * 2.5);
    ctx.fillRect(sx, sy, size, size);
  }

  drawShip(targetShip);

  ctx.strokeStyle = '#00ff00';
  ctx.lineWidth = 1;
  ctx.beginPath();
  ctx.moveTo(cx - 12, cy); ctx.lineTo(cx - 4, cy);
  ctx.moveTo(cx + 4, cy);  ctx.lineTo(cx + 12, cy);
  ctx.moveTo(cx, cy - 12); ctx.lineTo(cx, cy - 4);
  ctx.moveTo(cx, cy + 4);  ctx.lineTo(cx, cy + 12);
  ctx.stroke();

  telemetry.textContent = `SPEED: ${speed.toFixed(1)} | DIST: ${Math.round(targetShip.pos[2])}`;
}

function loop() {
  update();
  render();
  requestAnimationFrame(loop);
}
loop();
</script>
</body>
</html>
